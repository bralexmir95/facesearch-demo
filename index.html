<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>FaceSearch — prototipo de rediseño</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F7F9;--surface:#FFFFFF;--surface2:#F0F1F4;--border:#E5E7EB;--text:#0B0C10;--muted:#5B616E;--btn:#0B0C10;--btnText:#FFFFFF;--mint:#19C99A;--mintText:#047857;--mintTint:#E6F8F1;--mintBorder:#BDEFD9;--mintHead:#0E9F76;--tick:#DADDE3;--drop:#D5D9E0;--band:#0B0C10;--scrim:rgba(11,12,16,.45);--shadow:0 1px 2px rgba(11,12,16,.04),0 12px 40px rgba(11,12,16,.06)}
:root[data-theme="dark"]{--bg:#0A0B0F;--surface:#13151B;--surface2:#1A1D25;--border:#262A33;--text:#F4F5F7;--muted:#9AA0AC;--btn:#F4F5F7;--btnText:#0A0B0F;--mint:#3DE0B0;--mintText:#3DE0B0;--mintTint:#10261F;--mintBorder:#1C4A3C;--mintHead:#3DE0B0;--tick:#2A2E38;--drop:#2E323C;--band:#1A1D25;--scrim:rgba(0,0,0,.65);--shadow:0 12px 40px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--text);text-decoration:none}a:hover{color:var(--mintText)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:24px;padding-right:24px}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.proto{background:var(--mintTint);color:var(--mintText);font-size:13px;font-weight:600;text-align:center;padding:8px 16px}
.b1,.b2{height:48px;padding:0 20px;border-radius:14px;font:700 15px 'Plus Jakarta Sans',sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.b1{border:0;background:var(--btn);color:var(--btnText)}.b1:hover{color:var(--btnText);opacity:.9}
.b2{border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600}
.icon-btn{width:44px;height:44px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.muted{color:var(--muted)}
.logo{display:flex;align-items:center;gap:10px}
.logo span{font-family:'Sora',sans-serif;font-size:21px;font-weight:600;letter-spacing:-.04em}
.lt{stroke:var(--tick)}.lm{stroke:var(--mint)}.lx{stroke:var(--text)}

/* Cabecera */
header.top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
nav.main{display:flex;gap:4px}
nav.main a{padding:10px 14px;border-radius:10px;font-size:15px;font-weight:500;color:var(--muted)}
nav.main a:hover{color:var(--text);background:var(--surface2)}
.hactions{display:flex;align-items:center;gap:8px}
.region-btn{height:44px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.signin{height:44px;padding:0 18px;border-radius:12px;background:var(--btn);color:var(--btnText);font-size:14px;font-weight:600;display:inline-flex;align-items:center}
.signin:hover{color:var(--btnText)}
#menuBtn{display:none}
@media (max-width:900px){nav.main,.hactions .signin,.hactions .region-btn,.hactions #themeBtn{display:none}#menuBtn{display:inline-flex}}

/* Titular */
.hero{padding-top:64px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.hero h1{margin:0;font-size:clamp(40px,6vw,72px);line-height:1.04;font-weight:800;letter-spacing:-.04em}
.hero h1 .h1b{color:var(--mintHead)}
.hero p{margin:0;max-width:600px;font-size:18px;line-height:1.55;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted)}
.chip.g{background:var(--mintTint);border-color:var(--mintBorder);color:var(--mintText);font-weight:700}

/* Buscador + panel */
.search{padding-top:40px;padding-bottom:72px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:28px}
.upload{padding:12px;box-shadow:var(--shadow);display:flex}
.drop{flex:1;min-height:470px;padding:32px 20px;border:2px dashed var(--drop);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;transition:border-color .2s,background .2s}
.drop.over{border-color:var(--mint);background:var(--mintTint)}
.drop .st{display:contents}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.small{margin:0;font-size:13px;color:var(--muted)}
.ring{position:relative;width:184px;height:184px}
.ring svg{position:absolute;inset:0}
.ring img{position:absolute;left:38px;top:38px;width:108px;height:108px;border-radius:50%;object-fit:cover}
.scanwrap{position:absolute;left:38px;top:38px;width:108px;height:108px;border-radius:50%;overflow:hidden}
.scanline{position:absolute;left:0;right:0;top:0;height:3px;background:var(--mint);box-shadow:0 0 14px 4px var(--mint);animation:fsY 1.6s ease-in-out infinite}
@keyframes fsY{0%,100%{transform:translateY(0)}50%{transform:translateY(106px)}}
.prog{stroke-dasharray:414.7;stroke-dashoffset:414.7}
.prog.run{animation:fsP1 3.2s linear forwards}
@keyframes fsP1{to{stroke-dashoffset:0}}
.grid3{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--surface2)}
.tile::after{content:"";position:absolute;left:22%;top:18%;width:56%;height:56%;border-radius:50%;background:var(--tick);filter:blur(9px)}
.badge{padding:4px 10px;border-radius:999px;background:var(--mintTint);color:var(--mintText);font-size:12px;font-weight:700}
/* Emoticono animado */
@keyframes fsP{0%{stroke-dashoffset:414.7}55%,85%{stroke-dashoffset:0}92%,100%{stroke-dashoffset:414.7}}
@keyframes fsF{0%,55%{stroke:var(--text)}60%,85%{stroke:var(--mint)}92%,100%{stroke:var(--text)}}
@keyframes fsB{0%,18%,22%,40%,44%,100%{transform:scaleY(1)}20%,42%{transform:scaleY(.15)}}
@keyframes fsL{0%{transform:translate(0,0)}12%{transform:translate(-5px,0)}28%{transform:translate(5px,-3px)}44%{transform:translate(0,3px)}55%,100%{transform:translate(0,0)}}
@keyframes fsS{0%,55%{d:path("M66 94q14 9 28 0")}62%,85%{d:path("M62 91q18 15 36 0")}92%,100%{d:path("M66 94q14 9 28 0")}}
@keyframes fsK{0%,57%{opacity:0;transform:scale(.4)}62%{opacity:1;transform:scale(1.12)}66%,85%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(.4)}}
.fs-p{animation:fsP 6s ease-in-out infinite}.fs-f{animation:fsF 6s ease-in-out infinite}
.fs-e{transform-box:fill-box;transform-origin:center;animation:fsB 6s ease-in-out infinite}
.fs-l{animation:fsL 6s ease-in-out infinite}.fs-s{animation:fsS 6s ease-in-out infinite}
.fs-k{opacity:0;transform-box:fill-box;transform-origin:center;animation:fsK 6s ease-in-out infinite}

.panel{padding:20px;display:flex;flex-direction:column;gap:18px}
.tabs{padding:4px;border-radius:14px;background:var(--surface2);display:grid;grid-template-columns:1fr 1fr;gap:4px}
.tabs button{height:42px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column;gap:10px}
.step{padding:16px;border-radius:16px;background:var(--surface2);display:flex;gap:14px;align-items:flex-start;text-align:left}
.step b{flex:none;width:34px;height:34px;border-radius:10px;background:var(--btn);color:var(--btnText);display:flex;align-items:center;justify-content:center}
.step strong{display:block;font-size:16px}.step span{font-size:14px;line-height:1.5;color:var(--muted)}
.recent{padding:12px;border-radius:16px;border:1px solid var(--border);display:flex;align-items:center;gap:14px;text-align:left}
.recent .av{flex:none;width:52px;height:52px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.recent .tx{flex:1;min-width:0}.recent strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .when{font-size:13px;color:var(--muted)}
.recent .m{flex:none;padding:5px 10px;border-radius:999px;background:var(--mintTint);color:var(--mintText);font-size:12px;font-weight:700}
.recent button{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:var(--surface2);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.gnote{margin-top:auto;padding:14px 16px;border-radius:16px;background:var(--mintTint);color:var(--mintText);display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600}
.gnote svg{flex:none}

/* Secciones */
section.band{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.sec{padding-top:72px;padding-bottom:72px;display:flex;flex-direction:column;gap:32px}
.sec h2{margin:0;font-size:32px;font-weight:800;letter-spacing:-.03em}
.center{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.center p{margin:0;max-width:580px;font-size:16px;line-height:1.55;color:var(--muted)}
.more{font-size:14px;font-weight:700;color:var(--mintText)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:18px}
.box{padding:24px;border-radius:20px;display:flex;flex-direction:column;gap:8px}
.box strong{font-size:17px}.box span{font-size:14px;line-height:1.55;color:var(--muted)}
.box.o{background:var(--surface);border:1px solid var(--border)}.box.f{background:var(--surface2)}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.vhead p{margin:8px 0 0;color:var(--muted)}
.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:18px}
.video{position:relative;display:block;aspect-ratio:9/16;border-radius:22px;overflow:hidden;background:var(--surface2)}
.video img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.video:hover img{transform:scale(1.03)}
.video::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.65))}
.video .play{position:absolute;top:50%;left:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:999px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:1}
.video .h{position:absolute;left:16px;bottom:14px;color:#fff;font-size:13px;font-weight:600;z-index:1}
.price{padding:44px;border-radius:28px;background:var(--band);border:1px solid var(--border);color:#F4F5F7;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px}
.price h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.03em}
.price p{margin:10px 0 0;font-size:15px;color:#C3C7D0}
.cur{margin-top:14px;display:flex;gap:6px}
.cur button{height:36px;padding:0 14px;border:1px solid #3A3F4B;border-radius:999px;background:transparent;color:#C3C7D0;font-weight:600;font-size:13px;cursor:pointer}
.cur button[aria-checked="true"]{border-color:#3DE0B0;background:rgba(61,224,176,.14);color:#3DE0B0;font-weight:700}
.amount{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.amount b{font-size:44px;font-weight:800;letter-spacing:-.03em}
.amount a{height:48px;padding:0 22px;border-radius:14px;background:#3DE0B0;color:#0A0B0F;font-size:15px;font-weight:700;display:inline-flex;align-items:center}
@media (max-width:600px){.price{padding:28px}}

/* Pie */
footer{border-top:1px solid var(--border);background:var(--surface)}
footer .wrap{padding-top:24px;padding-bottom:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;font-size:14px}
footer .brand{display:flex;align-items:baseline;gap:10px;color:var(--muted);font-size:13px}
footer .brand b{font-family:'Sora',sans-serif;font-size:18px;font-weight:600;letter-spacing:-.04em;color:var(--text)}
footer nav{display:flex;flex-wrap:wrap;gap:6px 20px}
footer nav a{color:var(--muted)}
.social{display:flex;align-items:center;gap:2px}
.social a{width:36px;height:36px;border-radius:10px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.social button{margin-left:8px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer}

/* Diálogos (idioma/moneda) y menú lateral */
dialog{border:1px solid var(--border);border-radius:24px;background:var(--surface);color:var(--text);padding:24px;width:min(460px,calc(100% - 32px));box-shadow:0 24px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:var(--scrim)}
.dhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.dlabel{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opts button{height:46px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.opts.c3 button{justify-content:center}
.opts button[aria-pressed="true"]{border-color:var(--mint);background:var(--mintTint);color:var(--mintText);font-weight:700}
.opts small{color:var(--muted);font-size:12px}
#drawer{position:fixed;inset:0;z-index:40}
#drawer .scrim{position:absolute;inset:0;background:var(--scrim);border:0;padding:0;width:100%;cursor:pointer}
#drawer aside{position:absolute;top:0;right:0;bottom:0;width:min(330px,88vw);background:var(--surface);border-left:1px solid var(--border);border-radius:24px 0 0 24px;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;box-shadow:-24px 0 60px rgba(0,0,0,.3);animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
#drawer nav{display:flex;flex-direction:column;gap:2px}
#drawer nav a,#drawer nav button{height:48px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:var(--text);font-size:15px;font-weight:600;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left}
#drawer nav a:hover,#drawer nav button:hover{background:var(--mintTint);color:var(--mintText)}
.sep{height:1px;background:var(--border)}

/* Cámara a pantalla completa */
#cam{position:fixed;inset:0;z-index:60;background:#000;color:#fff;overflow:hidden}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#cam.env video{transform:none}
.hole{position:absolute;left:50%;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 200vmax rgba(0,0,0,.62)}
.camring{position:absolute;left:50%;transform:translate(-50%,-50%);pointer-events:none}
.camring .ticks{stroke:rgba(255,255,255,.35);transition:stroke .25s}
.camring.good .ticks{stroke:#3DE0B0}
.camring .hold{stroke:#3DE0B0;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.camring.closer{animation:closer 1.2s ease-in-out infinite}.camring.farther{animation:farther 1.2s ease-in-out infinite}
@keyframes closer{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
@keyframes farther{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(.93)}}
.ctop{position:absolute;top:0;left:0;right:0;padding:max(16px,env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between}
.round{width:48px;height:48px;border-radius:999px;border:0;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tip{position:absolute;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:999px;background:rgba(0,0,0,.55);font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;white-space:nowrap;transition:background .25s}
.tip.good{background:#3DE0B0;color:#0A0B0F}
.arrow{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;color:#fff;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{0%,100%{translate:0 0}50%{translate:var(--dx) var(--dy)}}
.cbottom{position:absolute;left:0;right:0;bottom:0;padding:0 16px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.shutter{width:76px;height:76px;border-radius:999px;border:4px solid #fff;background:rgba(255,255,255,.18);cursor:pointer;display:flex;align-items:center;justify-content:center}
.shutter span{width:58px;height:58px;border-radius:999px;background:#fff;transition:transform .15s}.shutter:active span{transform:scale(.9)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.flash.on{animation:fl .45s ease-out}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.cstate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.cstate p{margin:0;max-width:420px;line-height:1.55}
.cstate .help{padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.1);font-size:14px}
.cstate .b1{background:#fff;color:#0A0B0F}.cstate .b2{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.prog.run{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="proto" data-i18n="proto"></div>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="FaceSearch">
      <svg width="36" height="36" viewBox="0 0 48 48" aria-hidden="true"><defs><clipPath id="hdrArc"><path d="M24 24L24 0H48V30Z"/></clipPath></defs><circle class="lt" cx="24" cy="24" r="20" fill="none" stroke-width="4.5" stroke-dasharray="0.9 2.24"/><circle class="lm" cx="24" cy="24" r="20" fill="none" stroke-width="4.5" stroke-dasharray="0.9 2.24" clip-path="url(#hdrArc)"/><g class="lx" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="24" cy="24" r="10.5"/><path d="M20.4 21.2v2.2"/><path d="M27.6 21.2v2.2"/><path d="M24.3 22.4c.9 1.7.9 3.1-.4 4"/><path d="M20.4 28q3.6 2.8 7.2 0"/></g></svg>
      <span>facesearch</span>
    </a>
    <nav class="main" aria-label="Principal">
      <a href="#videos" data-i18n="nav_videos"></a>
      <a href="#garantia" data-i18n="nav_guarantee"></a>
      <a href="#precio" data-i18n="nav_price"></a>
      <a data-href="faq" data-i18n="nav_faq"></a>
    </nav>
    <div class="hactions">
      <button class="region-btn" type="button" data-open-region><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span data-region-short></span></button>

  cam_none: ['No se ha encontrado ninguna cámara.', 'No camera was found.', 'Aucune caméra trouvée.', 'Keine Kamera gefunden.', 'Nenhuma câmera encontrada.', 'カメラが見つかりません。', '未找到相机。']
};
const T = {};
LANGS.forEach(([code], li) => {
  const arr = FS_I18N[code], o = {};
  FS_I18N.keys.forEach((k, i) => { o[k] = arr[i] || FS_I18N.es[i]; });
  Object.keys(EXTRA).forEach((k) => { o[k] = EXTRA[k][li]; });
  T[code] = o;
});
const LOC = { es: 'es-ES', en: 'en-US', fr: 'fr-FR', de: 'de-DE', pt: 'pt-BR', ja: 'ja-JP', zh: 'zh-CN' };

  es: { privacy: 'privacidad', terms: 'terminos', remove: 'eliminar-mi-foto', blog: 'blog', settings: 'configuracion', faq: 'preguntas-frecuentes', uses: 'casos-de-uso', guarantee: 'resultados-garantizados' },
  fr: { privacy: 'confidentialite', terms: 'conditions', remove: 'supprimer-ma-photo', blog: 'blog', settings: 'parametres', faq: 'questions-frequentes', uses: 'cas-d-utilisation', guarantee: 'resultats-garantis' },
  de: { privacy: 'datenschutz', terms: 'nutzungsbedingungen', remove: 'mein-foto-entfernen', blog: 'blog', settings: 'einstellungen', faq: 'haeufige-fragen', uses: 'anwendungsfaelle', guarantee: 'garantierte-ergebnisse' },
  pt: { privacy: 'privacidade', terms: 'termos', remove: 'remover-minha-foto', blog: 'blog', settings: 'configuracoes', faq: 'perguntas-frequentes', uses: 'casos-de-uso', guarantee: 'resultados-garantidos' }

const browserLang = (navigator.language || 'es').slice(0, 2);

let t = T[lang];

function priceText() { try { return new Intl.NumberFormat(LOC[lang], { style: 'currency', currency: cur, currencyDisplay: 'narrowSymbol' }).format(3.99); } catch (e) { return SYM[cur] + '3.99'; } }
function url(k) {

/* ---------- Tema, idioma, menú, pestañas ---------- */
$$('[data-theme-toggle]').forEach((b) => b.addEventListener('click', () => { theme = theme === 'dark' ? 'light' : 'dark'; store.set('fs-theme', theme); apply(); }));
$$('[data-open-region]').forEach((b) => b.addEventListener('click', () => { closeDrawer(); $('region').showModal(); }));
$$('[data-close-region]').forEach((b) => b.addEventListener('click', () => $('region').close()));
$('region').addEventListener('click', (e) => { if (e.target === $('region')) $('region').close(); });
function openDrawer() { $('drawer').classList.remove('hidden'); $('menuBtn').setAttribute('aria-expanded', 'true'); $('drawer').querySelector('[data-close-drawer].icon-btn').focus(); }

$('menuBtn').addEventListener('click', openDrawer);
$$('[data-close-drawer]').forEach((b) => b.addEventListener('click', closeDrawer));
function setTab(which) {
  $('tabHow').setAttribute('aria-selected', String(which === 'how'));

  $('pHow').classList.toggle('hidden', which !== 'how');

$('tabHow').addEventListener('click', () => setTab('how'));
$('tabRecent').addEventListener('click', () => setTab('recent'));
$$('[data-tab]').forEach((b) => b.addEventListener('click', () => { setTab(b.dataset.tab); closeDrawer(); $('tabHow').scrollIntoView({ behavior: 'smooth', block: 'center' }); }));

/* ---------- Subir foto y búsqueda de demostración ---------- */
const show = (id) => ['sIdle', 'sPhoto', 'sResults'].forEach((x) => $(x).classList.toggle('hidden', x !== id));
let scanTimer = null;
function setPhoto(src, name) {
  $('preview').src = src; $('preview').alt = name || '';
  $('fileName').textContent = name || ''; $('fileName').classList.remove('hidden');
  $('scanning').classList.add('hidden'); $('scan').classList.add('hidden');
  $('prog').classList.remove('run'); $('photoBtns').classList.remove('hidden'); show('sPhoto');
}
function loadFile(f) { if (!f || !/^image\//.test(f.type)) return; const r = new FileReader(); r.onload = () => setPhoto(r.result, f.name); r.readAsDataURL(f); }
$('file').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; closeCam(); });
$('camInput').addEventListener('change', (e) => { loadFile(e.target.files[0]); e.target.value = ''; });
const drop = $('drop');
['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove('over')));
drop.addEventListener('drop', (e) => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
$('searchBtn').addEventListener('click', () => {
  $('photoBtns').classList.add('hidden'); $('fileName').classList.add('hidden');
  $('scan').classList.remove('hidden'); $('scanning').classList.remove('hidden');
  $('prog').classList.add('run');
  clearTimeout(scanTimer); scanTimer = setTimeout(() => show('sResults'), 3400);
});
$('again').addEventListener('click', () => { clearTimeout(scanTimer); show('sIdle'); });

/* ---------- Cámara ---------- */
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
const video = $('video');
let stream = null, facing = 'user', model = null, modelLoading = null, loopId = 0, lastDetect = 0, hold = 0, lastTs = 0, lightLow = false, lastLight = 0, geo = null, lastFocus = null;
const HOLD_MS = 1300;
const lum = document.createElement('canvas'); lum.width = 24; lum.height = 24;
const lumCtx = lum.getContext('2d', { willReadFrequently: true });
const ICON = {
  face: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 10v1.5"/><path d="M15 10v1.5"/><path d="M8.5 15q3.5 2.5 7 0"/></svg>',
  ok: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  sun: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  zin: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>',
  zout: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 14h6v6"/><path d="M20 10h-6V4"/><path d="M14 10l7-7"/><path d="M3 21l7-7"/></svg>'
};
function layout() {
  const w = innerWidth, h = innerHeight, r = Math.round(Math.min(w * 0.36, h * 0.27)), cy = Math.round(h * 0.45);
  const hole = $('hole'); hole.style.width = hole.style.height = (r * 2) + 'px'; hole.style.top = cy + 'px';
  const size = r * 2 + 64, R = r + 20, seg = (2 * Math.PI * R) / 72, L = 2 * Math.PI * (R + 13);
  const ring = $('ring');
  ring.setAttribute('width', size); ring.setAttribute('height', size); ring.setAttribute('viewBox', `0 0 ${size} ${size}`); ring.style.top = cy + 'px';
  ring.innerHTML = `<circle class="ticks" cx="${size / 2}" cy="${size / 2}" r="${R}" fill="none" stroke-width="14" stroke-dasharray="${(seg * 0.32).toFixed(2)} ${(seg * 0.68).toFixed(2)}"/>`
    + `<circle class="hold" id="holdArc" cx="${size / 2}" cy="${size / 2}" r="${R + 13}" fill="none" stroke-width="4" stroke-dasharray="${L.toFixed(1)}" stroke-dashoffset="${L.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>`;
  $('tip').style.top = Math.max(84, cy - r - 96) + 'px';
  return { r, cy, cx: w / 2 };
}
addEventListener('resize', () => { if (!$('cam').classList.contains('hidden')) geo = layout(); });
function setTip(key, icon, good) {
  const tip = $('tip');
  if (tip.dataset.k !== key) { tip.innerHTML = (ICON[icon] || '') + '<span></span>'; tip.lastChild.textContent = t[key]; tip.dataset.k = key; }
  tip.classList.toggle('good', !!good); $('ring').classList.toggle('good', !!good);
}
function setMotion(kind) { $('ring').classList.toggle('closer', kind === 'closer'); $('ring').classList.toggle('farther', kind === 'farther'); }
function setArrow(dx, dy) {
  const a = $('arrow');
  if (!dx && !dy) { a.classList.add('hidden'); return; }
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  a.classList.remove('hidden');
  a.style.left = (geo.cx + dx * (geo.r + 54)) + 'px'; a.style.top = (geo.cy + dy * (geo.r + 54)) + 'px'; a.style.rotate = ang + 'deg';
  a.style.setProperty('--dx', (Math.cos(ang * Math.PI / 180) * 8) + 'px'); a.style.setProperty('--dy', (Math.sin(ang * Math.PI / 180) * 8) + 'px');
}
function setHold(p) { const arc = $('holdArc'); if (!arc) return; const L = parseFloat(arc.getAttribute('stroke-dasharray')); arc.style.strokeDashoffset = (L * (1 - p)).toFixed(1); }
function camState(msgKey, help, btns) {
  $('cstate').classList.toggle('hidden', !msgKey);
  $('cmsg').textContent = msgKey ? t[msgKey] : '';
  $('chelp').classList.toggle('hidden', !help); $('cbtns').classList.toggle('hidden', !btns);
  ['cbottom', 'tip', 'ring', 'hole'].forEach((id) => { $(id).style.visibility = msgKey ? 'hidden' : 'visible'; });
}
function ensureModel() {
  if (model || modelLoading) return modelLoading;
  modelLoading = (async () => {
    for (let i = 0; i < 80 && !(window.tf && window.blazeface); i++) await new Promise((r) => setTimeout(r, 100));
    if (!(window.tf && window.blazeface)) return null;
    try { model = await blazeface.load({ maxFaces: 2 }); } catch (e) { model = null; }
    return model;
  })();
  return modelLoading;
}
async function openCam() {
  lastFocus = document.activeElement;
  $('cam').classList.remove('hidden'); $('cam').classList.toggle('env', facing === 'environment');
  document.body.style.overflow = 'hidden';
  geo = layout(); hold = 0; setHold(0); setArrow(0, 0); setMotion('');
  setTip('tip_place', 'face', false); camState('cam_loading', false, false);
  $('closeCam').focus();
  ensureModel();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { camState('cam_error', false, true); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    video.srcObject = stream;
    const pl = video.play(); if (pl && pl.catch) pl.catch(() => {});
    camState('');
    cancelAnimationFrame(loopId); lastTs = performance.now(); loopId = requestAnimationFrame(loop);
  } catch (err) {
    const n = err && err.name;
    camState(n === 'NotAllowedError' ? 'cam_blocked' : n === 'NotFoundError' ? 'cam_none' : 'cam_error', n === 'NotAllowedError', true);
  }
}
function stopCam() { cancelAnimationFrame(loopId); if (stream) { stream.getTracks().forEach((tr) => tr.stop()); stream = null; } }
function closeCam() {
  if ($('cam').classList.contains('hidden')) return;
  stopCam(); $('cam').classList.add('hidden'); document.body.style.overflow = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
function checkLight(now) {
  if (now - lastLight < 500 || !video.videoWidth) return;
  lastLight = now; lumCtx.drawImage(video, 0, 0, 24, 24);
  const d = lumCtx.getImageData(0, 0, 24, 24).data; let s = 0;
  for (let i = 0; i < d.length; i += 4) s += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
  lightLow = s / (d.length / 4) < 55;
}
function toScreen(x, y) {
  const vw = video.videoWidth, vh = video.videoHeight, sw = innerWidth, sh = innerHeight;
  const sc = Math.max(sw / vw, sh / vh), ox = (sw - vw * sc) / 2, oy = (sh - vh * sc) / 2;
  let X = ox + x * sc; const Y = oy + y * sc;
  if (facing === 'user') X = sw - X;
  return [X, Y];
}
async function loop(now) {
  loopId = requestAnimationFrame(loop);
  const dt = now - lastTs; lastTs = now;
  if (!video.videoWidth) return;
  checkLight(now);
  if (!model) { holdTick(dt, false); return; }
  if (now - lastDetect < 110) return;
  lastDetect = now;
  let faces = [];
  try { faces = await model.estimateFaces(video, false); } catch (e) { return; }
  evaluate(faces.filter((f) => (f.probability ? f.probability[0] : 1) > 0.85), dt);
}
function evaluate(faces, dt) {
  let ok = false;
  setMotion(''); setArrow(0, 0);
  if (lightLow) setTip('tip_light', 'sun', false);
  else if (faces.length === 0) setTip('tip_place', 'face', false);
  else if (faces.length > 1) setTip('tip_one', 'face', false);
  else {
    const f = faces[0];
    const [x1, y1] = toScreen(f.topLeft[0], f.topLeft[1]), [x2, y2] = toScreen(f.bottomRight[0], f.bottomRight[1]);
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, ratio = Math.abs(x2 - x1) / (geo.r * 2);
    const dx = (cx - geo.cx) / geo.r, dy = (cy - geo.cy) / geo.r;
    const [re, le, nose] = f.landmarks || [];
    let yaw = 0, roll = 0;
    if (re && le && nose) {
      const midX = (re[0] + le[0]) / 2, eyeD = Math.hypot(le[0] - re[0], le[1] - re[1]) || 1;
      yaw = (nose[0] - midX) / eyeD;
      roll = Math.atan2(le[1] - re[1], le[0] - re[0]) * 180 / Math.PI;
      if (roll > 90) roll -= 180; if (roll < -90) roll += 180;
    }
    if (ratio < 0.5) { setTip('tip_closer', 'zin', false); setMotion('closer'); }
    else if (ratio > 1.05) { setTip('tip_farther', 'zout', false); setMotion('farther'); }
    else if (Math.hypot(dx, dy) > 0.3) { setTip('tip_center', 'face', false); const m = Math.hypot(dx, dy); setArrow(-dx / m, -dy / m); }
    else if (Math.abs(yaw) > 0.32) setTip('tip_front', 'face', false);
    else if (Math.abs(roll) > 12) setTip('tip_straight', 'face', false);
    else { ok = true; setTip('tip_perfect', 'ok', true); }
  }
  holdTick(dt, ok);
}
function holdTick(dt, ok) {
  hold = ok ? Math.min(HOLD_MS, hold + Math.max(dt, 16)) : Math.max(0, hold - dt * 2);
  setHold(hold / HOLD_MS);
  if (ok && hold >= HOLD_MS) capture();
}
function capture() {
  if (!video.videoWidth) return;
  const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
  const ctx = c.getContext('2d');
  if (facing === 'user') { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, 0, 0);
  $('flash').classList.remove('on'); void $('flash').offsetWidth; $('flash').classList.add('on');
  if (navigator.vibrate) navigator.vibrate(40);
  const data = c.toDataURL('image/jpeg', 0.92); hold = 0;
  setTimeout(() => { closeCam(); setPhoto(data, 'camara.jpg'); }, 280);
}
$('openCam').addEventListener('click', () => { if (isMobile) $('camInput').click(); else openCam(); });
$('retry').addEventListener('click', () => { stopCam(); openCam(); });
$('closeCam').addEventListener('click', closeCam);
$('shutter').addEventListener('click', capture);
$('flip').addEventListener('click', () => { facing = facing === 'user' ? 'environment' : 'user'; stopCam(); openCam(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeCam(); closeDrawer(); } });

apply();
// Abierta con ?cam=1 (desde la maqueta): la cámara arranca directamente.
if (new URLSearchParams(location.search).get('cam') === '1' && !isMobile) openCam();
</script>
